<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Property Details - RentEase</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">RentEase</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
        <li class="nav-item"><a class="nav-link" href="register.html">Register</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Property Details Section -->
<section class="property-details py-5">
  <div class="container">
    <div class="row">
      <!-- Property Images and Info -->
      <div class="col-lg-8">
        <div class="property-main-info">
          <div class="property-image mb-4">
            <div id="propertyImageGallery">
              <img id="propertyImage" src="" class="img-fluid rounded" alt="Property Image">
            </div>
            <div id="propertyThumbnails" class="mt-3" style="display: none;">
              <!-- Thumbnails will be populated by JavaScript -->
            </div>
          </div>
          
          <div class="property-basic-info mb-4">
            <div class="d-flex justify-content-between align-items-start mb-3">
              <h1 id="propertyTitle" class="h2"></h1>
              <span id="availabilityBadge" class="badge fs-6"></span>
            </div>
            
            <div class="row mb-3">
              <div class="col-md-6">
                <p class="text-muted mb-1">
                  <i class="bi bi-geo-alt"></i> <span id="propertyLocation"></span>
                </p>
                <p class="text-muted mb-1">
                  <i class="bi bi-house"></i> <span id="propertyBedrooms"></span> BHK
                </p>
                <p class="text-muted mb-1">
                  <i class="bi bi-rulers"></i> <span id="propertyArea"></span>
                </p>
              </div>
              <div class="col-md-6">
                <p class="text-muted mb-1">
                  <i class="bi bi-person"></i> Owner: <span id="propertyOwner"></span>
                </p>
                <p class="text-muted mb-1">
                  <i class="bi bi-telephone"></i> <span id="propertyContact"></span>
                </p>
              </div>
            </div>
            
            <div class="price-section mb-4">
              <h3 class="text-success fw-bold" id="propertyPrice"></h3>
              <p class="text-muted">per month</p>
            </div>
          </div>
          
          <!-- Property Description -->
          <div class="property-description mb-4">
            <h4>Description</h4>
            <p id="propertyDescription" class="text-muted"></p>
          </div>
          
          <!-- Amenities -->
          <div class="property-amenities mb-4">
            <h4>Amenities</h4>
            <div id="amenitiesList" class="row g-2">
              <!-- Amenities will be populated by JavaScript -->
            </div>
          </div>
          
          <!-- Address -->
          <div class="property-address mb-4">
            <h4>Address</h4>
            <p id="propertyAddress" class="text-muted"></p>
          </div>
        </div>
      </div>
      
      <!-- Booking Form -->
      <div class="col-lg-4">
        <div class="booking-card">
          <div class="card">
            <div class="card-header">
              <h5 class="mb-0">Book/Enquire</h5>
            </div>
            <div class="card-body">
              <form id="bookingForm">
                <div class="mb-3">
                  <label for="bookingType" class="form-label">Type of Request</label>
                  <select class="form-select" id="bookingType" required>
                    <option value="">Select type</option>
                    <option value="enquiry">General Enquiry</option>
                    <option value="visit">Schedule Visit</option>
                    <option value="booking">Book Property</option>
                  </select>
                </div>
                
                <div class="mb-3">
                  <label for="visitDate" class="form-label">Preferred Visit Date</label>
                  <input type="date" class="form-control" id="visitDate">
                </div>
                
                <div class="mb-3">
                  <label for="visitTime" class="form-label">Preferred Time</label>
                  <select class="form-select" id="visitTime">
                    <option value="">Select time</option>
                    <option value="09:00">9:00 AM</option>
                    <option value="10:00">10:00 AM</option>
                    <option value="11:00">11:00 AM</option>
                    <option value="12:00">12:00 PM</option>
                    <option value="14:00">2:00 PM</option>
                    <option value="15:00">3:00 PM</option>
                    <option value="16:00">4:00 PM</option>
                    <option value="17:00">5:00 PM</option>
                    <option value="18:00">6:00 PM</option>
                  </select>
                </div>
                
                <div class="mb-3">
                  <label for="message" class="form-label">Message</label>
                  <textarea class="form-control" id="message" rows="3" placeholder="Tell us about your requirements..."></textarea>
                </div>
                
                <button type="submit" class="btn btn-primary w-100 mb-2">Submit Request</button>
                <button type="button" class="btn btn-outline-secondary w-100" onclick="toggleWishlist()">
                  <i class="bi bi-heart"></i> Add to Wishlist
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Footer -->
<footer class="bg-dark text-white text-center py-3">
  <p>© 2025 RentEase. All Rights Reserved.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
<script src="property-details.js"></script>
<script>
  // Update navigation on page load
  document.addEventListener('DOMContentLoaded', function() {
    updateNavigation();
  });
</script>
</body>
</html>
