<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rental Booking System</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" href="#">
        <img src=".png" alt="" class="logo me-2">
        RentEase
      </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
        <li class="nav-item"><a class="nav-link" href="register.html">Register</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Search Section -->
<section class="search-section py-5">
  <div class="container">
    <div class="text-center mb-4">
      <h1>Find Your Perfect Rental</h1>
      <p>Search for homes, PGs, and stores with ease</p>
    </div>
    
    <!-- Search Bar -->
    <div class="row justify-content-center mb-4">
      <div class="col-md-8">
        <input type="text" id="searchBox" class="form-control form-control-lg" placeholder="Search by location, property name, or description...">
      </div>
    </div>
    
    <!-- Filters -->
    <div class="row justify-content-center">
      <div class="col-md-10">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Filter Properties</h5>
            <div class="row g-3">
              <div class="col-md-3">
                <label for="typeFilter" class="form-label">Property Type</label>
                <select class="form-select" id="typeFilter">
                  <option value="">All Types</option>
                  <option value="apartment">Apartment</option>
                  <option value="pg">PG</option>
                  <option value="villa">Villa</option>
                  <option value="commercial">Commercial</option>
                </select>
              </div>
              <div class="col-md-2">
                <label for="bedrooms" class="form-label">Bedrooms</label>
                <select class="form-select" id="bedrooms">
                  <option value="">Any</option>
                  <option value="1">1 BHK</option>
                  <option value="2">2 BHK</option>
                  <option value="3">3 BHK</option>
                  <option value="4">4+ BHK</option>
                </select>
              </div>
              <div class="col-md-3">
                <label for="priceMin" class="form-label">Min Price (₹)</label>
                <input type="number" class="form-control" id="priceMin" placeholder="0" min="0">
              </div>
              <div class="col-md-3">
                <label for="priceMax" class="form-label">Max Price (₹)</label>
                <input type="number" class="form-control" id="priceMax" placeholder="50000" min="0">
              </div>
              <div class="col-md-1 d-flex align-items-end">
                <button class="btn btn-outline-secondary w-100" onclick="clearFilters()">Clear</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Property Listings -->
<section class="property-listings py-5">
  <div class="container">
    <h2 class="text-center mb-4">Available Properties</h2>
    <div class="row" id="propertyContainer">
      <!-- Property cards will load here from JS -->
    </div>
  </div>
</section>

<!-- Footer -->
<footer class="bg-dark text-white text-center py-3">
  <p>© 2025 RentEase. All Rights Reserved.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
